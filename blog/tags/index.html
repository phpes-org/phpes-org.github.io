---
layout: default
title: Tags
---
{% assign tags = site.tags | sort %}
<article>
    <header>
        <h2>Tags</h2>
    </header>
    <div>
        <p class="tags">
            {% for tag in tags %}
            <a href="#{{ tag[0] | slugify }}">{{ tag[0] }}</a>
            {% endfor %}
        </p>
    </div>
</article>

{% for tag in tags %}
<article>
    <h3 id="{{ tag[0] | slugify }}">"{{ tag[0] }}"</h3>
    <ul>
        {% for post in tag[1] %}
        <li>
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <small>{{ post.date | date: "%d/%m/%Y" }}</small>
        </li>
        {% endfor %}
    </ul>
</article>
{% endfor %}
